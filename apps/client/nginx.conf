server {
    # Nginx внутри web-контейнера принимает внешний HTTP-трафик.
    listen 80;
    server_name _;

    # Dockerfile клиента копирует сюда собранное Vite-приложение из /app/apps/client/dist.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Если статический файл существует, отдаем его напрямую.
        # Иначе возвращаем index.html, чтобы React Router обработал маршрут
        # после прямого открытия страницы или обновления браузера.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Браузер отправляет API-запросы на /api/* на том же origin, что и фронтенд.
        # Перед проксированием в Fastify убираем префикс /api, потому что backend
        # ожидает маршруты от корня своего приложения.
        rewrite ^/api/?(.*)$ /$1 break;

        # api - имя сервиса из Docker Compose. Оно резолвится внутри сети Compose.
        # Порт 3000 доступен другим контейнерам, но не публикуется наружу.
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # Передаем исходный host и IP клиента для backend-логов и middleware.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs/ {
        # Swagger UI генерирует ссылки на /docs/static/* без префикса /api,
        # поэтому документацию тоже проксируем напрямую в Fastify.
        proxy_pass http://api:3000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
